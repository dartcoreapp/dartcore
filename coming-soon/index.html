<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: radial-gradient(circle at center, #0a0a0a, #000);
    color: white;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }

  .content {
    flex: 1; /* takes remaining space, pushes footer to bottom */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 50px;
  }

  h5 {
    margin: 0;
    color: #aaa;
    letter-spacing: 1px;
    margin-bottom: 8rem;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 500;
  }

  .logo {
    font-size: 4rem;
    margin-bottom: 1rem;
  }


  footer {
    position: fixed;
    height: 100px;
    bottom: 0;
    width: 100%;
    color: #6c7379;
}

  .social-links {
    display: flex;
    justify-content: center;
    gap: 25px;
    font-size: 28px;
  }

  .social-links a {
    color: #6c7379;
    transition: color 0.3s;
  }

  .social-links a:hover {
    color: #4ef0eb; /* DartCore accent color */
  }
</style>

  <div class="px-4 py-5 my-5 text-center">
